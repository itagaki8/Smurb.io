<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Étudiant</title>
  <link rel="stylesheet" href="./css/output.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-semibold">Dashboard Étudiant</h1>
    <span class="text-sm">Bienvenue, Étudiant</span>
  </header>

  <!-- Main -->
  <main class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Soumission de sujet -->
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-bold mb-4">Proposer un sujet</h2>
      <form id="sujetForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Titre du sujet</label>
          <input type="text" id="titre" required class="w-full mt-1 p-2 border rounded-lg" />
        </div>
        <div>
          <label class="block text-sm font-medium">Description</label>
          <textarea id="description" required class="w-full mt-1 p-2 border rounded-lg"></textarea>
        </div>
        <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Soumettre</button>
      </form>
    </section>

    <!-- Sujet soumis -->
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-bold mb-4">Mon sujet</h2>
      <div id="sujetInfo" class="text-gray-600">
        Aucun sujet soumis.
      </div>
    </section>

    <!-- Attribution directeur -->
    <section class="bg-white rounded-xl shadow p-6 md:col-span-2">
      <h2 class="text-lg font-bold mb-4">Directeur attribué</h2>
      <div id="directeur" class="text-gray-600">En attente d’attribution.</div>
    </section>

  </main>

  <!-- JS -->
  <script>
    const form = document.getElementById('sujetForm');
    const sujetInfo = document.getElementById('sujetInfo');
    const directeur = document.getElementById('directeur');

    const directeurs = [
      'Dr. Jean Mukendi',
      'Prof. Alice Kanku',
      'Dr. Paul Ngoy',
      'Prof. Esther Mulumba'
    ];

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const titre = document.getElementById('titre').value;
      const description = document.getElementById('description').value;

      sujetInfo.innerHTML = `
        <p><strong>Titre :</strong> ${titre}</p>
        <p><strong>Description :</strong> ${description}</p>
        <p class="mt-2 text-green-600 font-semibold">Sujet soumis avec succès</p>
      `;

      const randomDirecteur = directeurs[Math.floor(Math.random() * directeurs.length)];
      directeur.innerHTML = `<span class="font-semibold">${randomDirecteur}</span>`;

      form.reset();
    });
  </script>

</body>
</html>
