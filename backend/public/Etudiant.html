<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/css/output.css">
    <title>Document</title>
</head>
<body>
    <div class="min-h-screen bg-gray-100 p-6">

  <!-- Titre -->
  <h1 class="text-2xl font-bold mb-6 text-center">
    Soumission du sujet de mémoire
  </h1>

  <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-6">

    <!-- FORMULAIRE -->
    <form class="flex flex-col gap-4" id="soumission">

      <div class="flex flex-col">
        <label for="intitule" class="font-semibold">Titre du mémoire</label>
        <input id="intitule" type="text" class="border p-2 rounded-md" placeholder="Ex: Système intelligent de gestion" name="intitule">
      </div>

      <div class="flex flex-col">
        <label for="description" class="font-semibold">Description / Résumé</label>
        <textarea id="description" class="border p-2 rounded-md" rows="4" name="description"></textarea>
      </div>

     

      <button class="bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700">
        Envoyer le sujet
      </button>

    </form>

  </div>

  <!-- RESULTAT ATTRIBUTION -->
  <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-xl p-6 mt-6">

    <h2 class="text-xl font-bold mb-4">Attribution du directeur</h2>

    <p><strong>Statut :</strong> En attente</p>
    <p><strong>Directeur :</strong> Non attribué</p>
    <p><strong>Spécialité :</strong> -</p>

  </div>

</div>

</body>

<script type="module" src="/Etudiant.js"></script>
</html>
